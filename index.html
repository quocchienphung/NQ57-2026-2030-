<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bộ chỉ số NQ 57 · Hệ thống Dashboard & Cổng nhập liệu KPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ══════════════════════════════════════════════════════════════════════════
   NQ57 · CIRCLE UI KIT
   Nguồn: ln-dev7/circle — app/globals.css + components/**
   Mọi màu đã quy đổi sang HEX/RGBA (Figma không đọc được oklch / color-mix).
   Thang xám = Tailwind zinc, đúng bằng giá trị oklch gốc của Circle.
   ══════════════════════════════════════════════════════════════════════════ */

/* ───────────────── TOKENS · Color/Light ───────────────── */
:root{
  --bg:#F7F7F8;              /* oklch(.975 .001 286.375) */
  --fg:#09090B;              /* zinc-950 */
  --container:#FFFFFF;
  --muted:#F4F4F5;           /* zinc-100 */
  --muted-fg:#71717A;        /* zinc-500 */
  --border:#E4E4E7;          /* zinc-200 */
  --ring:#D4D4D8;            /* zinc-300 */
  --sidebar:#F7F7F8;
  --sidebar-accent:#F4F4F5;
  --sidebar-border:#E4E4E7;
  --track:#F0F0F2;
  --field:#FFFFFF;

  /* Color/Class — bảng trạng thái gốc của Circle */
  --st-a:#4CB782;   /* A · HTXS ≥90   ← Shipped   */
  --st-b:#5E6AD2;   /* B · HTT 75–<90 ← Done      */
  --st-c:#F2C94C;   /* C · HT 60–<75  ← At risk   */
  --st-d:#EB5757;   /* D · CHT <60    ← Off track */
  --st-gray:#95A2B3;
  --st-cyan:#26B5CE;
  --st-orange:#F2790F;

  /* Color/Class-ink — biến thể DÙNG CHO CHỮ. Màu mark ở trên không đủ tương phản
     khi làm chữ (#4CB782 = 2,50:1 · #F2C94C = 1,59:1 trên nền trắng).
     Các giá trị dưới đây đều ≥ 4,5:1 — đạt WCAG AA cho chữ thường. */
  --st-a-ink:#2E7D5B;   /* 5,00:1 */
  --st-c-ink:#8A6D1F;   /* 4,90:1 */
  --st-d-ink:#C0392F;   /* 5,43:1 */

  /* Radius / Size */
  --r-lg:10px; --r-md:8px; --r-sm:6px; --r-full:999px;
  --h-header:40px; --w-sidebar:244px; --w-panel:328px; --pad-x:24px;
}
/* ───────────────── TOKENS · Color/Dark ───────────────── */
[data-theme="dark"]{
  --bg:#09090B;
  --fg:#FAFAFA;
  --container:#101011;
  --muted:#27272A;           /* zinc-800 */
  --muted-fg:#A1A1AA;        /* zinc-400 */
  --border:#27272A;
  --ring:#52525B;
  --sidebar:#18181B;         /* zinc-900 */
  --sidebar-accent:#27272A;
  --sidebar-border:#27272A;
  --track:#27272A;
  --field:#18181B;
  --st-a-ink:#5FD39A;   /* 10,21:1 trên #101011 */
  --st-c-ink:#E7C158;   /* 11,02:1 */
  --st-d-ink:#FF8080;   /*  7,83:1 */
}

/* ───────────────── RESET ───────────────── */
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:Geist,"Be Vietnam Pro",ui-sans-serif,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--fg);font-size:14px;line-height:1.45;
  -webkit-font-smoothing:antialiased;height:100svh;overflow:hidden;display:flex;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
svg{display:block}
:focus-visible{outline:2px solid var(--ring);outline-offset:1px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
::-webkit-scrollbar-track{background:transparent}

/* Type/Mono — bật tnum để cột số thẳng hàng */
.mono{font-family:"Geist Mono",ui-monospace,SFMono-Regular,monospace;font-feature-settings:"tnum" 1}

/* Figma frame mode — khoá khung 1440×900 để chụp/ xuất đúng khổ artboard */
body.frame-1440{width:1440px;height:900px;margin:auto;border:1px solid var(--border);overflow:hidden}
html.frame-host{display:grid;place-items:center;background:var(--bg);height:100svh}

/* ══════════════════════ Layout/Sidebar ══════════════════════ */
.sidebar{width:var(--w-sidebar);flex:none;background:var(--sidebar);display:flex;flex-direction:column;height:100%}
.sb-header{padding:8px}
.org{display:flex;align-items:center;gap:8px;width:100%;height:40px;padding:0 8px;border-radius:var(--r-md);text-align:left}
.org:hover{background:var(--sidebar-accent)}
.org-avatar{width:26px;height:26px;flex:none;border-radius:var(--r-sm);background:#C8102E;color:#F5C518;display:grid;place-items:center;font-size:11px;font-weight:700}
.org-txt{flex:1;min-width:0}
.org-txt span{display:block}
.org-txt .n{font-size:13px;font-weight:600;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.org-txt .s{font-size:11px;color:var(--muted-fg);line-height:1.3}
.sb-content{flex:1;overflow-y:auto;padding:0 8px 8px;display:flex;flex-direction:column;gap:1px}
.sb-group{margin-top:10px}
.sb-label{height:28px;display:flex;align-items:center;padding:0 8px;font-size:11px;font-weight:500;color:var(--muted-fg)}
.sb-item{display:flex;align-items:center;gap:8px;height:30px;padding:0 8px;border-radius:var(--r-md);font-size:13px;width:100%;text-align:left}
.sb-item:hover{background:var(--sidebar-accent)}
.sb-item.active{background:var(--sidebar-accent);font-weight:500}
.sb-item svg{width:16px;height:16px;flex:none;opacity:.75}
.sb-item .lbl{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-item .cnt{font-size:11px;color:var(--muted-fg)}
.sb-item .badge{font-size:10px;font-weight:600;background:var(--st-d);color:#fff;border-radius:var(--r-full);padding:1px 6px;line-height:1.5}
.dot{width:8px;height:8px;border-radius:var(--r-full);flex:none}
.dot-sm{width:6px;height:6px;border-radius:var(--r-full);flex:none;display:inline-block}
.sb-footer{padding:8px;display:flex;flex-direction:column;gap:8px}
.sb-card{border:1px solid var(--sidebar-border);border-radius:var(--r-lg);padding:12px;background:var(--container)}
.sb-card .t{font-size:12.5px;font-weight:600;line-height:1.3}
.sb-card .d{font-size:11.5px;color:var(--muted-fg);margin-top:4px;line-height:1.4}
.sb-card .bar{height:4px;border-radius:2px;background:var(--track);margin-top:10px;overflow:hidden}
.sb-card .bar i{display:block;height:100%;background:var(--st-b);border-radius:2px}
.sb-tools{display:flex;align-items:center;justify-content:space-between}

/* Button/Icon */
.icon-btn{width:28px;height:28px;border-radius:var(--r-md);display:grid;place-items:center;color:var(--muted-fg);flex:none}
.icon-btn:hover{background:var(--sidebar-accent);color:var(--fg)}
.icon-btn svg{width:16px;height:16px}

/* ══════════════════════ Layout/ContentFrame ══════════════════════ */
.shell{flex:1;min-width:0;height:100%;padding:8px 8px 8px 0;overflow:hidden}
.frame{height:100%;width:100%;background:var(--container);border:1px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;overflow:hidden}

/* Header/Primary */
.hdr{height:var(--h-header);flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad-x);gap:16px}
.hdr-l{display:flex;align-items:center;gap:12px;min-width:0}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none}
.crumb{font-size:13px;font-weight:600;white-space:nowrap}
.crumb .sep,.crumb .sub{display:none}
@media (min-width:1620px){ .crumb .sep,.crumb .sub{display:inline} }
.crumb .sep{color:var(--muted-fg);font-weight:400;margin:0 6px}
.crumb .sub{color:var(--muted-fg);font-weight:400}
.tabs{display:flex;align-items:center;gap:4px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{height:28px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;border-radius:var(--r-full);border:1px solid transparent;font-size:12px;font-weight:500;color:var(--muted-fg);white-space:nowrap}
.tab:hover{background:var(--muted);color:var(--fg)}
.tab.active{background:var(--muted);color:var(--fg);border-color:var(--border)}
.tab .n{font-size:11px;opacity:.7}
.search{display:flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-md);color:var(--muted-fg);font-size:12px;min-width:190px;background:var(--field)}
.search svg{width:14px;height:14px;flex:none}
.kbd{margin-left:auto;font-size:10px;border:1px solid var(--border);border-radius:4px;padding:0 4px;line-height:15px}
.avatar{width:24px;height:24px;border-radius:var(--r-full);background:var(--st-b);color:#fff;display:grid;place-items:center;font-size:10px;font-weight:600;flex:none}

/* Header/FilterBar */
.subhdr{height:var(--h-header);flex:none;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad-x);gap:16px}
.chips{display:flex;align-items:center;gap:6px;overflow:hidden}
.chip{height:26px;padding:0 9px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--r-md);font-size:12px;white-space:nowrap;flex:none}
.chip:hover{background:var(--muted)}
.chip .k{color:var(--muted-fg)}
.chip svg{width:12px;height:12px;opacity:.6;flex:none}
.chip.ghost{border-style:dashed;color:var(--muted-fg)}
.chip.primary{background:var(--st-b);border-color:var(--st-b);color:#fff}
.chip.primary:hover{background:#4F5AC4}
.stamp{font-size:11.5px;color:var(--muted-fg);display:flex;align-items:center;gap:6px;white-space:nowrap}

/* Layout/Body */
.body{flex:1;min-height:0;display:flex;overflow:hidden}
.main{flex:1;min-width:0;overflow-y:auto}
.panel{width:var(--w-panel);flex:none;border-left:1px solid var(--border);overflow-y:auto;background:var(--container)}

/* ══════════════════════ Data/StatStrip ══════════════════════ */
.stats{display:grid;gap:0;border-bottom:1px solid var(--border)}
.stats.c4{grid-template-columns:repeat(4,1fr)}
.stats.c3{grid-template-columns:repeat(3,1fr)}
.stats.c2{grid-template-columns:repeat(2,1fr)}
.stat{padding:16px var(--pad-x);border-right:1px solid var(--border);min-width:0}
.stat:last-child{border-right:0}
.stat .lbl{font-size:11px;font-weight:500;color:var(--muted-fg);display:flex;align-items:center;gap:6px}
.stat .lbl svg{width:13px;height:13px;opacity:.7;flex:none}
.stat .val{display:flex;align-items:baseline;gap:6px;margin-top:8px;font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1;flex-wrap:wrap}
.stat .val>span{white-space:nowrap}
.stat .val small{font-size:12px;font-weight:400;color:var(--muted-fg)}
.stat .delta{font-size:11.5px;font-weight:500;margin-left:auto;white-space:nowrap}
.up{color:var(--st-a-ink)} .down{color:var(--st-d-ink)} .flat{color:var(--muted-fg)}
.segbar{display:flex;height:5px;border-radius:3px;overflow:hidden;background:var(--track);margin-top:12px}
.segbar i{display:block;height:100%}
.legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.legend span{font-size:11px;color:var(--muted-fg);display:inline-flex;align-items:center;gap:5px}
.legend b{color:var(--fg);font-weight:500}
.sub{font-size:11.5px;color:var(--muted-fg);margin-top:9px}

/* ══════════════════════ List/SectionHeader ══════════════════════ */
.list-head{height:38px;display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad-x);border-bottom:1px solid var(--border);background:var(--container)}
.list-head .t{font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px}
.list-head .t .n{font-weight:400;color:var(--muted-fg)}
.list-head .r{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--muted-fg)}

/* List/GroupHeader — nền tint = màu loại @8% (Circle: `${color}08`) */
.grp-head{height:var(--h-header);display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad-x);position:sticky;top:0;z-index:5;background:var(--container)}
.grp-head .l{display:flex;align-items:center;gap:8px;min-width:0}
.grp-head .nm{font-size:13px;font-weight:500}
.grp-head .ct{font-size:13px;color:var(--muted-fg)}
.grp-head .rule{font-size:11px;color:var(--muted-fg);white-space:nowrap}
.tint-a{background:rgba(76,183,130,.08)}
.tint-b{background:rgba(94,106,210,.08)}
.tint-c{background:rgba(242,201,76,.10)}
.tint-d{background:rgba(235,87,87,.08)}
.tint-gray{background:rgba(149,162,179,.08)}
.tint-cyan{background:rgba(38,181,206,.08)}
.tint-orange{background:rgba(242,121,15,.08)}

/* List/Row */
.row{display:flex;align-items:center;gap:8px;padding:11px var(--pad-x);border-bottom:1px solid rgba(113,113,122,.10);font-size:13px}
[data-theme="dark"] .row{border-bottom-color:rgba(161,161,170,.10)}
.row:hover{background:rgba(113,113,122,.05)}
.row-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.rank{width:24px;height:24px;flex:none;border-radius:var(--r-sm);background:var(--muted);display:grid;place-items:center;font-size:11px;font-weight:500}
.unit{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.unit:hover{text-decoration:underline;text-underline-offset:2px}
.col{flex:none;text-align:right}
.c-lay{width:44px;color:var(--muted-fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-tot{width:54px;font-weight:600}
.c-trk{width:112px;display:flex;align-items:center;gap:8px}
.c-cls{width:88px;display:flex;justify-content:flex-start}
.c-dt{width:46px;font-size:11.5px;font-weight:500}

/* Data/Pill */
.pill{display:inline-flex;align-items:center;gap:5px;flex:none;font-size:11px;border:1px solid var(--border);border-radius:var(--r-full);padding:1px 7px;color:var(--muted-fg);white-space:nowrap}
.pill.danger{color:var(--st-d-ink);border-color:rgba(235,87,87,.35)}
.pill.warn{color:var(--st-c-ink);border-color:rgba(242,201,76,.45)}
.pill.ok{color:var(--st-a-ink);border-color:rgba(76,183,130,.35)}
.pill.solid{border:0;padding:2px 8px;font-weight:500}
/* Nhãn phụ — ẩn ở màn hẹp, đúng cách Circle làm với `hidden lg:inline-flex` */
.pill.opt{display:none}
@media (min-width:1600px){ .pill.opt{display:inline-flex} }

/* Data/ProgressTrack — vạch dọc = ngưỡng mục tiêu 75% */
.trk{flex:1;height:5px;border-radius:3px;background:var(--track);position:relative}
.trk i{display:block;height:100%;border-radius:3px}
.trk::after{content:"";position:absolute;left:75%;top:-4px;bottom:-4px;width:1.5px;background:var(--muted-fg);opacity:.85;border-radius:1px}
.trk.no-mark::after{display:none}
.trk-v{font-size:11px;color:var(--muted-fg);width:34px;text-align:right;flex:none}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;white-space:nowrap}

/* ══════════════════════ Panel/Insights ══════════════════════ */
.pn-head{height:var(--h-header);display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--container);z-index:5}
.pn-head .t{font-size:13px;font-weight:600}
.pn-sec{padding:12px 16px 16px}
.pn-lbl{font-size:11px;font-weight:500;color:var(--muted-fg);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:8px}
.pn-div{height:1px;background:var(--border)}
.gp{display:block;width:calc(100% + 16px);text-align:left;padding:8px;margin:0 -8px;border-radius:var(--r-md)}
.gp:hover{background:var(--muted)}
.gp-top{display:flex;align-items:center;gap:8px}
.gp-id{width:18px;height:18px;flex:none;border-radius:5px;background:var(--muted);display:grid;place-items:center;font-size:10px;font-weight:600}
.gp-nm{flex:1;min-width:0;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gp-v{font-size:12px;font-weight:600;flex:none}
.gp-bot{display:flex;align-items:center;gap:8px;margin-top:6px;padding-left:26px}
.gp-trk{flex:1;height:4px;border-radius:2px;background:var(--track);position:relative}
.gp-trk i{display:block;height:100%;border-radius:2px}
.gp-trk::after{content:"";position:absolute;left:75%;top:-3px;bottom:-3px;width:1.5px;background:var(--muted-fg);opacity:.8;border-radius:1px}
.gp-ct{font-size:10.5px;color:var(--muted-fg);width:40px;text-align:right;flex:none}

/* Panel/AlertItem */
.al{display:flex;gap:8px;padding:9px 8px;margin:0 -8px;border-radius:var(--r-md);width:calc(100% + 16px);text-align:left}
.al:hover{background:var(--muted)}
.al-ic{width:16px;flex:none;display:flex;justify-content:center;padding-top:3px}
.al-b{flex:1;min-width:0}
.al-t{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.al-code{font-size:11px;font-weight:600}
.al-lv{font-size:9.5px;font-weight:600;border-radius:4px;padding:1px 5px;border:1px solid var(--border);color:var(--muted-fg)}
.al-lv.hi{color:var(--st-d);border-color:rgba(235,87,87,.35)}
.al-d{display:block;font-size:11.5px;color:var(--muted-fg);margin-top:3px;line-height:1.35}
.al-o{display:block;font-size:11px;color:var(--muted-fg);margin-top:4px;opacity:.85}

/* Panel/KeyValue */
.kv{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:6px 0;font-size:12px}
.kv .k{color:var(--muted-fg);flex:none}
.kv .v{text-align:right;font-weight:500}

/* ══════════════════════ Form ══════════════════════ */
.form-sec{padding:16px var(--pad-x);border-bottom:1px solid var(--border)}
.form-sec .h{font-size:13px;font-weight:600;margin-bottom:2px}
.form-sec .hint{font-size:11.5px;color:var(--muted-fg);margin-bottom:14px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 20px}
.fgrid.c1{grid-template-columns:1fr}
.fgrid.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.field label{display:block;font-size:11px;font-weight:500;color:var(--muted-fg);margin-bottom:5px}
.field .req{color:var(--st-d)}
.input,.textarea,.select{width:100%;height:32px;padding:0 10px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--field);font-size:13px;outline:none}
.input:focus,.textarea:focus,.select:focus{border-color:var(--ring)}
.textarea{height:auto;min-height:64px;padding:8px 10px;line-height:1.5;resize:vertical}
.input:disabled,.input.locked{background:var(--muted);color:var(--muted-fg);cursor:not-allowed}
.field .help{font-size:11px;color:var(--muted-fg);margin-top:5px}
.field .help.err{color:var(--st-d)}
.field .help.ok{color:var(--st-a)}
.inline-unit{position:relative}
.inline-unit .u{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11.5px;color:var(--muted-fg);pointer-events:none}

/* Button */
.btn{height:30px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:var(--r-md);font-size:12.5px;font-weight:500;white-space:nowrap}
.btn:hover{background:var(--muted)}
.btn svg{width:14px;height:14px;flex:none}
.btn.primary{background:var(--st-b);border-color:var(--st-b);color:#fff}
.btn.primary:hover{background:#4F5AC4}
.btn.danger{color:var(--st-d);border-color:rgba(235,87,87,.35)}
.btn.ghost{border-color:transparent}
.btn-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

/* Dropzone */
.dropzone{border:1.5px dashed var(--border);border-radius:var(--r-lg);padding:22px;text-align:center;color:var(--muted-fg);font-size:12.5px}
.dropzone b{display:block;color:var(--fg);font-size:13px;font-weight:600;margin-bottom:4px}

/* Table */
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th{text-align:left;font-size:11px;font-weight:500;color:var(--muted-fg);padding:8px var(--pad-x);border-bottom:1px solid var(--border);white-space:nowrap;background:var(--container)}
.tbl td{padding:9px var(--pad-x);border-bottom:1px solid rgba(113,113,122,.10);vertical-align:top}
[data-theme="dark"] .tbl td{border-bottom-color:rgba(161,161,170,.10)}
.tbl tr:hover td{background:rgba(113,113,122,.05)}
.tbl td.num,.tbl th.num{text-align:right}
.tbl .muted{color:var(--muted-fg)}

/* Card */
.cards{display:grid;gap:12px;padding:16px var(--pad-x)}
.cards.c2{grid-template-columns:repeat(2,minmax(0,1fr))}
.cards.c3{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{border:1px solid var(--border);border-radius:var(--r-lg);padding:14px;background:var(--container)}
.card .ct{font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:8px}
.card .cd{font-size:11.5px;color:var(--muted-fg);margin-top:5px;line-height:1.45}
.card .cv{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-top:10px}

/* Callout */
.callout{display:flex;gap:10px;padding:12px 14px;border:1px solid var(--border);border-radius:var(--r-lg);margin:16px var(--pad-x);font-size:12.5px;line-height:1.5}
.callout .ci{flex:none;padding-top:1px}
.callout.inline{margin:0 0 12px}
.callout b{font-weight:600}
.callout.warn{background:rgba(242,201,76,.08);border-color:rgba(242,201,76,.35)}
.callout.info{background:rgba(94,106,210,.06);border-color:rgba(94,106,210,.28)}
.callout.err{background:rgba(235,87,87,.07);border-color:rgba(235,87,87,.32)}

/* Stepper */
.stepper{display:flex;padding:16px var(--pad-x);gap:0}
.step{flex:1;min-width:0;position:relative;padding-right:12px}
.step .sd{width:18px;height:18px;border-radius:var(--r-full);border:2px solid var(--border);background:var(--container);display:grid;place-items:center;font-size:9px;font-weight:700;color:var(--muted-fg)}
.step.done .sd{background:var(--st-a);border-color:var(--st-a);color:#fff}
.step.current .sd{border-color:var(--st-b);color:var(--st-b)}
.step .sl{height:2px;background:var(--border);position:absolute;left:18px;right:0;top:8px}
.step.done .sl{background:var(--st-a)}
.step:last-child .sl{display:none}
.step .sn{font-size:12px;font-weight:500;margin-top:8px}
.step .ss{font-size:11px;color:var(--muted-fg);margin-top:2px;line-height:1.4}

/* Timeline */
.tl{padding:6px var(--pad-x) 16px}
.tl-item{display:flex;gap:12px;padding:9px 0}
.tl-rail{width:18px;flex:none;display:flex;flex-direction:column;align-items:center}
.tl-rail .d{width:9px;height:9px;border-radius:var(--r-full);flex:none;margin-top:5px}
.tl-rail .l{flex:1;width:1.5px;background:var(--border);margin-top:4px}
.tl-b{flex:1;min-width:0}
.tl-t{font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.tl-m{font-size:11.5px;color:var(--muted-fg);margin-top:3px;line-height:1.45}

/* Heatmap */
.heat-wrap{padding:12px var(--pad-x) 18px;overflow-x:auto}
.heat{border-collapse:separate;border-spacing:3px;font-size:11px}
.heat th{font-weight:500;color:var(--muted-fg);font-size:10.5px;padding:0 2px}
.heat th.rowh{text-align:left;font-size:12px;color:var(--fg);font-weight:400;padding-right:10px;white-space:nowrap}
.heat th.colh{writing-mode:vertical-rl;transform:rotate(180deg);height:78px;white-space:nowrap;font-size:10.5px}
.heat td{width:26px;height:26px;border-radius:var(--r-sm);text-align:center;color:#fff;font-size:10px;font-weight:600}

/* Chart/GroupResults — biểu đồ thanh ngang 8 nhóm nhiệm vụ.
   Cột: nhãn 248 · vùng vẽ co giãn · giá trị 96. Lưới dọc vẽ đè lên đúng vùng vẽ. */
.gchart{position:relative;padding:14px var(--pad-x) 10px;display:grid;
        grid-template-columns:248px minmax(0,1fr) 96px;align-items:center;gap:9px 14px}
.gc-lines{position:absolute;left:286px;right:134px;top:14px;bottom:34px;pointer-events:none;z-index:2}
.gc-lines i{position:absolute;top:0;bottom:0;width:1px;background:var(--fg);opacity:.13}
.gc-lines i.t{width:0;background:none;border-left:1.5px dashed var(--muted-fg);opacity:.8}
.gc-lbl{display:flex;align-items:center;gap:8px;min-width:0;font-size:13px}
.gc-num{width:18px;height:18px;flex:none;border-radius:5px;background:var(--muted);
        display:grid;place-items:center;font-size:10px;font-weight:600}
.gc-nm{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gc-bar{height:10px;border-radius:5px;background:var(--track);position:relative}
.gc-bar i{display:block;height:100%;border-radius:5px}
.gchart:hover .gc-bar i{opacity:.55}
.gc-bar:hover i{opacity:1}
.gc-end{display:flex;align-items:baseline;justify-content:flex-end;gap:8px}
.gc-end b{font-size:12.5px;font-weight:600}
.gc-ct{font-size:11px;color:var(--muted-fg)}
.gc-axis{position:relative;height:15px;margin-top:3px}
.gc-axis span{position:absolute;transform:translateX(-50%);font-size:10.5px;color:var(--muted-fg)}
.gc-axis span:first-child{transform:none}
.gc-axis span:last-child{transform:translateX(-100%)}

/* List/ThresholdRule — vạch phân định đạt / chưa đạt ngưỡng điều hành */
.thr{display:flex;align-items:center;gap:12px;padding:7px var(--pad-x);background:var(--container)}
.thr-l{flex:1;height:0;border-top:1px dashed var(--border)}
.thr-t{font-size:11px;color:var(--muted-fg);white-space:nowrap}
.thr-t b{color:var(--fg);font-weight:600}

/* Chart */
.chart-wrap{padding:16px var(--pad-x)}
.chart-legend{display:flex;gap:16px;flex-wrap:wrap;padding:0 var(--pad-x) 12px}
.chart-legend span{font-size:11.5px;color:var(--muted-fg);display:inline-flex;align-items:center;gap:6px}
.lg-line{width:16px;height:2px;border-radius:1px;display:inline-block}

/* Diagram (star schema / lineage) */
.diagram{padding:16px var(--pad-x) 20px;overflow-x:auto}
.dg-node{fill:var(--container);stroke:var(--border)}
.dg-t{font-size:11px;font-weight:600;fill:var(--fg)}
.dg-s{font-size:9.5px;fill:var(--muted-fg)}
.dg-l{stroke:var(--muted-fg);stroke-opacity:.45;stroke-width:1.2;fill:none}

/* Footnote */
.foot-note{padding:14px var(--pad-x) 30px;font-size:11px;color:var(--muted-fg);display:flex;gap:20px;flex-wrap:wrap}
.foot-note b{color:var(--fg);font-weight:500}

@media (max-width:1330px){ .panel{display:none} }
@media (max-width:1200px){ .sidebar{display:none} .shell{padding:8px} .stats.c4{grid-template-columns:repeat(2,1fr)} }

/* Chart/Line — SVG thuần, import thẳng vào Figma thành vector */
function lineChart(){
  const W=1000,H=250,PL=42,PR=16,PT=14,PB=26, y0=55,y1=100;
  const X=i=>PL+i*(W-PL-PR)/(TREND.years.length-1);
  const Y=v=>PT+(1-(v-y0)/(y1-y0))*(H-PT-PB);
  const path=arr=>arr.map((v,i)=>v===null?null:`${i&&arr[i-1]!==null?'L':'M'}${X(i).toFixed(1)} ${Y(v).toFixed(1)}`).filter(Boolean).join(' ');
  const grid=[60,70,80,90,100].map(v=>
    `<line x1="${PL}" x2="${W-PR}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--border)" stroke-dasharray="3 3"/>
     <text x="${PL-8}" y="${Y(v)+3.5}" text-anchor="end" font-size="10" fill="var(--muted-fg)">${v}</text>`).join('');
  const xlab=TREND.years.map((y,i)=>`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10.5" fill="var(--muted-fg)">${y}</text>`).join('');
  const area=`M${X(0)} ${Y(TREND.actual[0])} L${X(1)} ${Y(TREND.actual[1])} L${X(1)} ${H-PB} L${X(0)} ${H-PB} Z`;
  const dots=TREND.actual.map((v,i)=>v===null?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="3.5" fill="var(--st-b)" stroke="var(--container)" stroke-width="2"/>`).join('')
    + TREND.forecast.map((v,i)=>(v===null||i<2)?'':`<circle cx="${X(i)}" cy="${Y(v)}" r="3" fill="var(--container)" stroke="var(--st-b)" stroke-width="1.6"/>`).join('');
  const ms=TREND.milestones.map(m=>{const i=TREND.years.indexOf(m.y);
    return `<line x1="${X(i)}" x2="${X(i)}" y1="${PT}" y2="${H-PB}" stroke="var(--st-orange)" stroke-opacity=".45" stroke-dasharray="2 3"/>`}).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" data-fig="Chart/LineTrend" style="overflow:visible">
    ${grid}${ms}
    <path d="${area}" fill="var(--st-b)" fill-opacity=".10"/>
    <path d="${path(TREND.target)}" stroke="var(--st-gray)" stroke-width="1.5" stroke-dasharray="5 4" fill="none"/>
    <path d="${path(TREND.forecast)}" stroke="var(--st-b)" stroke-width="1.8" stroke-dasharray="4 4" fill="none" stroke-opacity=".65"/>
    <path d="${path(TREND.actual)}" stroke="var(--st-b)" stroke-width="2.2" fill="none"/>
    ${dots}${xlab}
  </svg>`;
}

/* Chart/GroupResults — yêu cầu 3 của đầu bài: 1 biểu đồ cho 8 nhóm nhiệm vụ.
   Dạng thanh ngang: 8 hạng mục, nhãn tiếng Việt dài, so sánh độ lớn + 1 mốc mục tiêu.
   Giá trị và nhãn dùng mực chữ, KHÔNG tô màu theo chuỗi — màu chỉ nằm ở thanh bar. */
function groupChart(){
  const rows=GROUPS.map(g=>{
    const col=CLS[clsOf(g.pct)].c;
    return `<span class="gc-lbl"><span class="gc-num mono">${g.i}</span><span class="gc-nm" title="${g.name}">${g.short||g.name}</span></span>
      <span class="gc-bar" title="${g.name} — đạt ${fx(g.pct)}% · ${g.done}/${g.tot} KPI"><i style="width:${g.pct}%;background:${col}"></i></span>
      <span class="gc-end"><b class="mono">${fx(g.pct)}%</b><span class="gc-ct mono">${g.done}/${g.tot}</span></span>`;
  }).join('');
  return `<div class="gchart" data-fig="Chart/GroupResults">
    <div class="gc-lines"><i style="left:25%"></i><i style="left:50%"></i><i class="t" style="left:75%"></i><i style="left:100%"></i></div>
    ${rows}
    <span></span>
    <div class="gc-axis">${[0,25,50,75,100].map(v=>`<span style="left:${v}%">${v}${v===100?'%':''}</span>`).join('')}</div>
    <span></span>
  </div>
  <div class="chart-legend" style="padding:2px var(--pad-x) 16px">
    ${['A','B','C','D'].map(c=>`<span><i class="dot-sm" style="background:${CLS[c].c}"></i>${CLS[c].n} · ${CLS[c].rule.replace(' · chưa đạt ngưỡng','').replace(' · cần xử lý','')}</span>`).join('')}
    <span><i class="lg-line" style="background:var(--muted-fg);opacity:.5"></i>Mục tiêu 75%</span>
  </div>`;
}

/* Heatmap 8 nhóm × 13 đơn vị */
function heatmap(){
  const head=`<tr><th class="rowh"></th>${UNITS.map(u=>`<th class="colh">${u.code}</th>`).join('')}<th class="rowh" style="padding-left:8px">TB</th></tr>`;
  const rows=GROUPS.map((g,gi)=>{
    let sum=0;
    const cells=UNITS.map((u,ui)=>{
      const v=Math.max(32,Math.min(100,Math.round(g.pct*(u.t/78.8)+(((gi*7+ui*13)%9)-4))));
      sum+=v; const cls=clsOf(v);
      return `<td style="background:${CLS[cls].c}" title="${g.name} · ${u.code}: ${v}%">${v}</td>`;
    }).join('');
    return `<tr><th class="rowh" title="${g.name}">${g.i}. ${g.short||g.name}</th>${cells}<th class="rowh mono" style="padding-left:8px">${Math.round(sum/UNITS.length)}</th></tr>`;
  }).join('');
  return `<div class="heat-wrap"><table class="heat" data-fig="Chart/Heatmap">${head}${rows}</table>
    <div class="chart-legend" style="padding:14px 0 0">
      ${['A','B','C','D'].map(c=>`<span><i class="dot-sm" style="background:${CLS[c].c}"></i>${CLS[c].n} · ${CLS[c].rule}</span>`).join('')}
    </div></div>`;
}

    <text x="${x+12}" y="${y+19}" class="dg-t">${t}</text><text x="${x+12}" y="${y+34}" class="dg-s">${s}</text></g>`;
  const L=(x1,y1,x2,y2)=>`<path class="dg-l" d="M${x1} ${y1} C${(x1+x2)/2} ${y1}, ${(x1+x2)/2} ${y2}, ${x2} ${y2}"/>`;
  return `<svg viewBox="0 0 1000 382" width="100%" height="382" data-fig="Diagram/StarSchema">
    ${L(184,63,420,113)}${L(184,133,420,113)}${L(184,203,420,113)}${L(184,273,420,133)}

    ${B(800,110,'Approval_Workflow','Fact · trạng thái duyệt')}
    ${B(800,250,'Action_Log','Fact · KPI đỏ/vàng')}

}

      <thead><tr><th>Nguồn</th><th>Cách refresh</th><th>Tần suất</th><th>Gateway</th><th>Ghi chú</th></tr></thead>
      <tbody>
        <tr><td><b style="font-weight:500">Excel template</b> ${C.pill('MVP')}</td><td class="muted">Theo lịch sau hạn nộp hoặc refresh thủ công khi chốt kỳ</td><td class="mono">Theo kỳ</td><td class="muted">Không bắt buộc</td><td class="muted">Phải khoá cấu trúc mẫu và quy ước tên file</td></tr>
        <tr><td><b style="font-weight:500">SharePoint Lists/Docs</b> ${C.pill('Phase 2')}</td><td class="muted">Scheduled refresh, tách refresh dữ liệu nhập và mô hình điểm</td><td class="mono">2 lần/ngày</td><td class="muted">Không cần</td><td class="muted">Power Automate nhắc hạn và khoá bản ghi sau duyệt</td></tr>
        <tr><td><b style="font-weight:500">Database tập trung</b> ${C.pill('Phase 3')}</td><td class="muted">Incremental refresh cho bảng fact nhiều kỳ</td><td class="mono">Mỗi giờ</td><td class="muted">On-premises gateway</td><td class="muted">Có cảnh báo thất bại và quy trình xử lý credential</td></tr>
      </tbody>
    </table>

    ${C.listHead('Phân quyền và RLS động',roles.length,'<span>Bảng <span class="mono">User_Access_Map</span> + <span class="mono">USERPRINCIPALNAME()</span></span>')}
    <table class="tbl" data-fig="Data/Table">
      <thead><tr><th>Vai trò</th><th>Phạm vi dữ liệu</th><th>Quyền xem/sửa</th><th>Phê duyệt</th><th>Hành động đặc biệt</th><th class="num">Xem toàn bộ</th></tr></thead>
      <tbody>${roles.map(r=>`<tr><td><b style="font-weight:500">${r[0]}</b></td><td class="muted">${r[1]}</td><td>${r[2]}</td>
        <td class="muted">${r[3]}</td><td class="muted">${r[4]}</td>
        <td class="num">${r[5]==='Có'?C.pill('Có','ok'):C.pill('Không')}</td></tr>`).join('')}</tbody>
    </table>

    ${C.listHead('Governance & Data Quality',4)}
    <div class="cards c2">
      <div class="card"><div class="ct">${ICON.db} Chuẩn đặt tên</div>
        <div class="cd">Workspace / report / dataset theo mẫu <span class="mono">VIAGS-KPI-NQ57-DEV / TEST / PROD</span>. Danh mục KPI_Master và Org_Unit chỉ Admin và VP Đảng ủy được sửa, đi qua quy trình thay đổi.</div></div>
      <div class="card"><div class="ct">${ICON.check} Data quality rules</div>
        <div class="cd">Bắt buộc KPI_ID · Org_ID · Period_ID · actual_value hoặc actual_text · evidence khi KPI yêu cầu. Kiểm tra kiểu dữ liệu và ngưỡng hợp lý. Lỗi ghi vào bảng <span class="mono">Data_Quality_Issue</span>.</div></div>
      <div class="card"><div class="ct">${ICON.link} Lineage</div>
        <div class="cd">Lineage view hiển thị nguồn → dataflows → semantic model → reports → external dependencies. Mọi kết quả chấm điểm lưu <span class="mono">calc_version</span> để truy vết khi công thức đổi.</div></div>
      <div class="card"><div class="ct">${ICON.lock} Bảo mật</div>
        <div class="cd">Xác thực qua Microsoft Entra ID / SSO. Sensitivity label cho semantic model và report, hạn chế export theo chính sách nội bộ. Hạn chế chia sẻ tự phát ngoài Power BI App.</div></div>

    ${C.listHead('Audit log gần đây',AUDIT.length,'<span>Ghi nhận: tạo/sửa/xoá submission · minh chứng · phê duyệt · khoá kỳ · refresh · export</span>')}
    <div class="tl">
      ${AUDIT.map(a=>`<div class="tl-item" data-fig="List/AuditRow"><div class="tl-rail"><span class="d" style="background:${a.c}"></span><span class="l"></span></div>
        <div class="tl-b"><div class="tl-t">${a.a} <span class="mono" style="color:var(--muted-fg);font-weight:400">${a.t}</span></div>
        <div class="tl-m">${a.o} · <b style="color:var(--fg);font-weight:500">${a.u}</b></div></div></div>`).join('')}
    </div>`;
  },
  panel(){
    return C.panelHead('Trạng thái vận hành')+`
    <div class="pn-sec">
      <div class="pn-lbl"><span>Workspace</span></div>
      ${C.kv('PROD','<span class="status"><i class="dot-sm" style="background:var(--st-a)"></i>Bình thường</span>')}
      ${C.kv('TEST','<span class="status"><i class="dot-sm" style="background:var(--st-a)"></i>Bình thường</span>')}
      ${C.kv('DEV','<span class="status"><i class="dot-sm" style="background:var(--st-c)"></i>Đang cập nhật</span>')}
      ${C.kv('Gateway','<span class="status"><i class="dot-sm" style="background:var(--st-a)"></i>Online</span>')}
    </div>
    <div class="pn-div"></div>
    <div class="pn-sec">
      <div class="pn-lbl"><span>Lỗi refresh gần nhất</span></div>
      <div class="al-d" style="margin:0">12/07 15:00 — timeout khi đọc SharePoint List <span class="mono">KPI_Submission</span>. Đã chạy lại lúc 15:22 thành công.</div>

/* ══════════════════════════════════════════════════════════════════════════
   9 · ROUTER
   ══════════════════════════════════════════════════════════════════════════ */
const NAVGROUPS=[
  {k:'bod', label:'Dashboard BOD'},
  {k:'bcd', label:'Ban Chỉ đạo'},
  {k:'unit',label:'Cổng đơn vị · '+ME.code},
  {k:'adm', label:'Quản trị hệ thống'},
];
let CUR='bod-01';

function renderNav(){
  const inbox=`<button class="sb-item" data-fig="Sidebar/NavItem">${ICON.inbox}<span class="lbl">Thông báo</span><span class="badge">3</span></button>`;
  const groups=NAVGROUPS.map(g=>{
    const items=Object.entries(SCREENS).filter(([,s])=>s.group===g.k).map(([id,s])=>
      `<button class="sb-item ${id===CUR?'active':''}" data-go="${id}" data-fig="Sidebar/NavItem">
         ${ICON[s.nav.icon]}<span class="lbl">${s.nav.label}</span>
         ${s.nav.badge?`<span class="badge">${s.nav.badge}</span>`:s.nav.count?`<span class="cnt mono">${s.nav.count}</span>`:''}
       </button>`).join('');
    return `<div class="sb-group"><div class="sb-label">${g.label}</div>${items}</div>`;
  }).join('');
  const layers=`<div class="sb-group"><div class="sb-label">Lớp chỉ số</div>
    ${[['b','Lớp A · Chỉ đạo',17],['cyan','Lớp B · Quản trị',37],['orange','Lớp C · Chuyên đề',21]]
      .map(([c,n,v])=>`<button class="sb-item"><span class="dot" style="background:${CV[c]};margin-left:4px"></span><span class="lbl">${n}</span><span class="cnt mono">${v}</span></button>`).join('')}
   </div>
   <div class="sb-group"><div class="sb-label">Kỳ đánh giá</div>
    ${[['a','Quý II/2027','đang mở'],['gray','Quý I/2027',''],['gray','Năm 2026','']]
      .map(([c,n,v])=>`<button class="sb-item"><span class="dot" style="background:${CV[c]};margin-left:4px"></span><span class="lbl">${n}</span><span class="cnt">${v}</span></button>`).join('')}
   </div>`;
  $('nav').innerHTML=inbox+groups+layers;
  $('nav').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function render(){
  const s=SCREENS[CUR];
  const tabs=Object.entries(SCREENS).filter(([,x])=>x.group===s.group);
  $('hdr').innerHTML=`
    <div class="hdr-l">
      <button class="icon-btn" title="Ẩn/hiện thanh bên">${ICON.panelL}</button>
      <span class="crumb">${s.code}<span class="sep">·</span><span class="sub">${s.title}</span></span>
      <div class="tabs" data-fig="Header/Tabs">${tabs.map(([id,x])=>
        `<button class="tab ${id===CUR?'active':''}" data-go="${id}">${x.nav.label}${x.nav.count?` <span class="n mono">${x.nav.count}</span>`:x.nav.badge?` <span class="n mono">${x.nav.badge}</span>`:''}</button>`).join('')}</div>
    </div>
    <div class="hdr-r">
      <div class="search" data-fig="Header/SearchField">${ICON.search}Tìm đơn vị, mã KPI…<span class="kbd mono">⌘K</span></div>
      <button class="icon-btn" title="Thông báo">${ICON.bell}</button>
      <span class="avatar">VP</span>
    </div>`;
  $('subhdr').innerHTML=`
    <div class="chips">
      ${(s.chips||[]).map(([k,v])=>`<button class="chip" data-fig="Header/FilterChip"><span class="k">${k}</span> ${v}${ICON.chevron}</button>`).join('')}
      <button class="chip ghost">${ICON.plus} Thêm bộ lọc</button>
    </div>
    <div class="hdr-r">
      <span class="stamp">${s.stamp||'<span class="dot-sm" style="background:var(--st-b)"></span> Cập nhật · <span class="mono">15/07 03:00</span>'}</span>
      <button class="chip">${ICON.sliders} Hiển thị</button>
    </div>`;
  $('main').innerHTML=s.main();
  $('panel').innerHTML=s.panel?s.panel():'';
  $('panel').style.display=s.panel?'':'none';
  $('main').scrollTop=0;
  $('hdr').querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}
function go(id){ CUR=id; renderNav(); render(); location.hash=id; }

/* Theme + Figma frame */
$('themeBtn').onclick=()=>{
  const d=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',d?'light':'dark');
};
$('frameBtn').onclick=()=>{
  document.body.classList.toggle('frame-1440');
  document.documentElement.classList.toggle('frame-host');
};
window.addEventListener('hashchange',()=>{const id=location.hash.slice(1); if(SCREENS[id]&&id!==CUR) go(id);});
if(SCREENS[location.hash.slice(1)]) CUR=location.hash.slice(1);
/* ?theme=dark và ?frame=1440 — tiện chụp ảnh hàng loạt để đưa vào Figma */
const Q=new URLSearchParams(location.search);
if(Q.get('theme')==='dark') document.documentElement.setAttribute('data-theme','dark');
if(Q.get('frame')==='1440'){ document.body.classList.add('frame-1440'); document.documentElement.classList.add('frame-host'); }
renderNav(); render();
</script>
</body>
</html>
